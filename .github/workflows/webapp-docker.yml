on: [workflow_dispatch]
name: Deploy Containerized Web App

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - uses: azure/login@v2
      with:
        client-id: ${{ secrets.ARM_DEPLOYER_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy ACR
      id: deployAcrStep
      uses: azure/arm-deploy@v1
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION }}
        resourceGroupName: ${{ secrets.AZURE_RG }}
        template: ./acr/acr.bicep
        failOnStdErr: false

    - name: Upload Image
      run: |
        echo "ACR Name ${{ steps.deployAcrStep.outputs.acrLoginServer}}"
        az acr build --registry ${{ steps.deployAcrStep.outputs.acrLoginServer}} --image webapplication1:v1.0.${{ github.run_number }} --image webapplication1:latest ./WebApplication1

    - name: Deploy Web App
      uses: azure/arm-deploy@v1
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION }}
        resourceGroupName: ${{ secrets.AZURE_RG }}
        template: ./webapp-docker/webapp-docker.bicep
        failOnStdErr: false

    - name: Assign Acr Pull Role to Web App
      uses: azure/arm-deploy@v1
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION }}
        resourceGroupName: ${{ secrets.AZURE_RG }}
        template: ./webapp-docker/assign-acr-pull-to-webapp.bicep
        failOnStdErr: false