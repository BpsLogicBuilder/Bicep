on: [workflow_dispatch]
name: Deploy ACR

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Log into Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.ARM_DEPLOYER_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy
      id: deployStep
      uses: azure/arm-deploy@v1
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION }}
        resourceGroupName: ${{ secrets.AZURE_RG }}
        template: ./acr/acr.bicep
        failOnStdErr: false

    - name: Upload Image
      run: |
        echo "ACR Name ${{ steps.deployStep.outputs.acrLoginServer}}"
        az acr build --registry ${{ steps.deployStep.outputs.acrLoginServer}} --image webapplication1:v1.0.0 --image webapplication1:latest ./WebApplication1